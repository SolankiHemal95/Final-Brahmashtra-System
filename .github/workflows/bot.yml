name: 24/7 Trading Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # Runs every 5 hours

concurrency:
  group: trading-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Bot (Max 4h55m)
        run: |
          # Stop script gently after 4 hours 55 minutes to allow graceful exit and next cron to take over
          timeout 17700s node bot.js || echo "Bot exited gracefully after timeout"
